name: Free rejected UPDATE counterfactual diagnostic
on:
  push:
    branches: [multimodel-update-offline-diagnostic]
permissions:
  contents: read
  actions: read
jobs:
  independent-offline-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: updated-product
          run-id: 38381781297
          github-token: ${{ github.token }}
          path: received
      - name: Targeted free schema regressions
        run: |
          mkdir result
          python3 -m unittest -v test_model_adapter.OfflineTypeRegressionTests > result/schema-tests.log 2>&1
      - name: Rootless runtime without environment secrets
        run: |
          image_ref=$(python3 -c 'import json; print(json.load(open("received/runtime-profile.json"))["image_reference"])')
          bash setup_rootless.sh "$image_ref"
          cp runtime-profile.json result/
      - name: Counterfactual isolated behavior; no submit and no provider requests
        run: |
          python3 - <<'PY' > result/oracle.log 2>&1
          import json
          from pathlib import Path
          from test_model_adapter import run_offline_type_experiment
          image=json.loads(Path('runtime-profile.json').read_text())['image_id']
          r=run_offline_type_experiment('received','result',image)
          assert r['status']=='OFFLINE_COUNTERFACTUAL_BEHAVIOR_PASS'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: offline-update-diagnostic
          path: result/
          retention-days: 1
          if-no-files-found: error
