name: Pilot 3 one DeepSeek repair from independent oracle
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  repair-worker:
    environment: forge-api-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: executor-result
          run-id: 38370767080
          github-token: ${{ github.token }}
          path: failed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pilot2-failure-diagnosis
          run-id: 38371237731
          github-token: ${{ github.token }}
          path: feedback
      - name: Pin rootless runtime, no provider secrets
        run: |
          image_ref=$(python3 -c 'import json; print(json.load(open("failed/runtime-profile.json"))["image_reference"])')
          bash setup_rootless.sh "$image_ref"
          mkdir -p result
          cp runtime-profile.json result/
      - name: Exactly one authorized repair call then worker oracle
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          image_id=$(python3 -c 'import json; print(json.load(open("runtime-profile.json"))["image_id"])')
          python3 llm_cycle.py --repair-from failed --feedback-from feedback/diagnosis.json --root result --image "$image_id" > result/repair.log 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repaired-create
          path: result/
          retention-days: 1
          if-no-files-found: error
  independent-create:
    needs: repair-worker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repaired-create
          path: received-one
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repaired-create
          path: received-two
      - name: Same isolated image on separate VM
        run: |
          image_ref=$(python3 -c 'import json; print(json.load(open("received-one/runtime-profile.json"))["image_reference"])')
          bash setup_rootless.sh "$image_ref"
      - name: Independent CREATE acceptance, delivered bytes and UPDATE budget
        run: |
          python3 - <<'PY'
          import json,tempfile
          from pathlib import Path
          from executor import Executor,sha
          from isolation import PodmanBackend
          from contracts import verify
          from processes import Deadline
          one=Path('received-one');two=Path('received-two')
          metadata=json.loads((one/'repair-evidence.json').read_text())
          data=(one/'product.zip').read_bytes()
          assert data==(two/'product.zip').read_bytes() and sha(data)==metadata['product_sha256']
          image=json.loads(Path('runtime-profile.json').read_text())['image_id']
          with tempfile.TemporaryDirectory() as tmp:
              backend=PodmanBackend(image,sha(tmp.encode()));executor=Executor(Path(tmp)/'state',backend)
              workspace=Path(tmp)/'product';executor._write_files(workspace,executor._archive(one/'product.zip',metadata['product_sha256']))
              deadline=Deadline(120);backend.begin('0'*64,deadline);isolation=backend.preflight(deadline)
              checks=verify(workspace,'csv-v1',backend,deadline);assert checks['ok']
              raw=json.loads((one/'model-response.json').read_text())
              for name,source in raw['files'].items():assert (workspace/name).read_bytes()==source.encode()
          result={'status':'INDEPENDENT_REPAIRED_CREATE_DELIVERY_VERIFIED','checks':checks,'isolation':isolation,'product_sha256':sha(data),'downloaded_twice_equal':True,'model_requests':0,'update_executed':False,'lifecycle_pass':False}
          (one/'delivery-controller.json').write_text(json.dumps(result,indent=2));print(json.dumps(result,indent=2))
          plan=json.loads((one/'update-plan.json').read_text());plan['status']='CREATE_ACCEPTED_UPDATE_CALL_REQUIRES_OWNER_AUTHORIZATION'
          (one/'update-plan.json').write_text(json.dumps(plan,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: repaired-create-controller
          path: |
            received-one/delivery-controller.json
            received-one/update-plan.json
          retention-days: 1
