name: Pilot 2 failure diagnosis no model API calls
on:
  push:
    branches: [multimodel-api-pilot2]
permissions:
  contents: read
  actions: read
jobs:
  diagnose-one-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: executor-result
          run-id: 38370767080
          github-token: ${{ github.token }}
          path: failed
      - name: Rootless runtime without model credentials
        run: bash setup_rootless.sh
      - name: Reproduce only the failing large Decimal fixture
        run: |
          python3 - <<'PY'
          import json,sqlite3,hashlib
          from pathlib import Path
          from executor import Executor,sha
          from isolation import PodmanBackend
          from contracts import CASES
          from processes import Deadline
          db=sqlite3.connect('file:failed/controller-private/adapter.sqlite3?mode=ro',uri=True)
          saved=json.loads(db.execute('SELECT result FROM jobs').fetchone()[0]);db.close()
          raw=saved['raw_model_content']
          assert sha(raw.encode())=='e7dae265cb404b1921c66c4497e5c33b53afc3da27e5fa5082c88f335975622c'
          profile=json.loads(Path('runtime-profile.json').read_text())
          backend=PodmanBackend(profile['image_id'],sha(b'pilot2-diagnostic'))
          executor=Executor('diagnostic-state',backend)
          workspace=Path('diagnostic-candidate').resolve()
          executor._write_files(workspace,{n:s.encode() for n,s in saved['task']['files'].items()})
          deadline=Deadline(120);backend.begin('1'*64,deadline)
          isolation=backend.preflight(deadline)
          text,expected,_=CASES[6];(workspace/'input.csv').write_text(text)
          run=backend.run(workspace,'summary.py','input.csv',deadline)
          actual=json.loads(run['stdout'])
          assert run['exit_code']==0 and actual['rows']==expected['rows'] and actual['total']!=expected['total']
          result={'status':'EXPECTED_PRODUCT_FAILURE_REPRODUCED','qualification_pass':False,'model_requests':0,'fixture_index':6,'raw_model_sha256':sha(raw.encode()),'expected':expected,'actual':actual,'run':run,'isolation':isolation}
          Path('diagnosis.json').write_text(json.dumps(result,indent=2));print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pilot2-failure-diagnosis
          path: diagnosis.json
          retention-days: 1
