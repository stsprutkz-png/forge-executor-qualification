name: API pilot credential preflight (no provider requests)
on:
  push:
    branches: [multimodel-stage1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credential-preflight:
    if: github.repository == 'stsprutkz-png/forge-executor-qualification' && !github.event.repository.private
    environment: forge-api-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check secret presence only; no API requests
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          presence={n:bool(os.environ.get(n)) for n in ('DEEPSEEK_API_KEY','OPENROUTER_API_KEY')}
          result={'environment':'forge-api-pilot','credentials_present':presence,'model_requests':0,'api_cost_generated_usd':0,'status':'CREDENTIALS_PRESENT_UNVALIDATED' if all(presence.values()) else 'BLOCKED_CREDENTIALS_MISSING'}
          pathlib.Path('preflight.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-credential-preflight
          path: preflight.json
          retention-days: 1
          if-no-files-found: error
