name: UPDATE diagnostic repair synthetic HTTP tests only
on:
  push:
    branches: [multimodel-update-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  diagnostic-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repaired-create
          run-id: 38373418459
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: repaired-create-controller
          run-id: 38373418459
          github-token: ${{ github.token }}
          path: acceptance
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: updated-product
          run-id: 38375079359
          github-token: ${{ github.token }}
          path: failed-update
      - name: Synthetic-only tests, actual socket connections forbidden
        env:
          DIAGNOSTIC_BASELINE_DIR: baseline
          DIAGNOSTIC_ACCEPTANCE_FILE: acceptance/delivery-controller.json
        run: |
          python3 - <<'PY' > diagnostic-tests.log 2>&1
          import json,unittest,socket,sqlite3,hashlib
          from pathlib import Path
          from unittest.mock import patch
          old=Path('failed-update/baseline-product.zip').read_bytes()
          assert hashlib.sha256(old).hexdigest()==hashlib.sha256(Path('baseline/product.zip').read_bytes()).hexdigest()=='634c9205351c84736e6af8b1d0c7301c239380d8014f39349f7d6d36db5aa17d'
          db=sqlite3.connect('file:failed-update/state/state.sqlite3?mode=ro',uri=True)
          assert db.execute('SELECT task_id,phase FROM operations ORDER BY rowid').fetchall()==[('create-1','FAILED'),('create-1-repair-1','COMPLETE')]
          db.close()
          suite=unittest.defaultTestLoader.loadTestsFromName('test_model_adapter.AuditDiagnosticsTests')
          with patch('socket.create_connection',side_effect=AssertionError('REAL_NETWORK_FORBIDDEN')),patch('socket.socket.connect',side_effect=AssertionError('REAL_NETWORK_FORBIDDEN')):
              result=unittest.TextTestRunner(verbosity=2).run(suite)
          Path('diagnostic-result.json').write_text(json.dumps({'status':'DIAGNOSTIC_REPAIR_PASS' if result.wasSuccessful() else 'FAIL','tests':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'paid_model_requests':0,'http_responses':'explicit synthetic doubles','baseline_head_unchanged':True,'full_lifecycle_pass':False},indent=2))
          raise SystemExit(0 if result.wasSuccessful() else 2)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: update-diagnostic-evidence
          path: |
            diagnostic-tests.log
            diagnostic-result.json
          retention-days: 1
